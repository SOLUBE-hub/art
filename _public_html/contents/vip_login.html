<div class="login-box">
        <h1>ENTER KEYWORD</h1>
        <input type="text" id="keywordInput" autocomplete="off" spellcheck="false"><br>
        <button onclick="checkPassword()">UNLOCK</button>
        <div id="errorMsg"></div>
    </div>
    <script>
        function checkPassword() {
            const input = document.getElementById('keywordInput').value.toUpperCase();
            if (input === 'PREY') {
                document.body.style.opacity = 0;
                setTimeout(() => { window.location.href = 'work5.html'; }, 1000);
            } else {
                document.getElementById('errorMsg').innerText = 'ACCESS DENIED';
                setTimeout(() => { document.getElementById('errorMsg').innerText = ''; }, 2000);
            }
        }
    </script>
