<div class="viewer-header">
        <a href="exhibition_room.html" class="back-btn">← BACK TO EXHIBITION</a>
        <div class="artwork-title-nav">No.04 - 星降る夜</div>
        <div class="controls">
            <button class="control-btn" id="zoomOut">-</button>
            <button class="control-btn" id="zoomIn">+</button>
        </div>
    </div>
    <div class="viewer-container" id="viewerContainer">
        <div class="artwork-wrapper" id="artworkWrapper" style="transform: translate(0px, 0px) scale(1);">
            <img src="https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80" class="artwork-img" alt="星降る夜" draggable="false">
            <div class="hidden-letter" id="hiddenLetter">Y</div>
        </div>
    </div>
    <div class="hint-text">スクロールまたはボタンで画像を限界まで拡大してください。ドラッグで移動可能です。</div>
    <script>
        const container = document.getElementById('viewerContainer');
        const wrapper = document.getElementById('artworkWrapper');
        const btnZoomIn = document.getElementById('zoomIn');
        const btnZoomOut = document.getElementById('zoomOut');
        let scale = 1, translateX = 0, translateY = 0, isDragging = false, startX, startY;
        const REVEAL_SCALE = 3.5; 
        
        function updateTransform() {
            if (scale < 1) scale = 1; if (scale > 5) scale = 5;
            if (scale === 1) { translateX = 0; translateY = 0; }
            wrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
            if (scale >= REVEAL_SCALE) { wrapper.classList.add('zoomed-in'); } else { wrapper.classList.remove('zoomed-in'); }
        }
        
        container.addEventListener('wheel', (e) => { e.preventDefault(); scale += e.deltaY * -0.005; updateTransform(); }, { passive: false });
        btnZoomIn.addEventListener('click', () => { scale += 0.5; updateTransform(); });
        btnZoomOut.addEventListener('click', () => { scale -= 0.5; updateTransform(); });
        
        // PCマウス操作
        container.addEventListener('mousedown', (e) => { e.preventDefault(); if (scale > 1) { isDragging = true; startX = e.clientX - translateX; startY = e.clientY - translateY; } });
        window.addEventListener('mousemove', (e) => { if (isDragging) { translateX = e.clientX - startX; translateY = e.clientY - startY; updateTransform(); } });
        window.addEventListener('mouseup', () => { isDragging = false; });

        // スマホ用タッチイベント（ドラッグ移動）
        container.addEventListener('touchstart', (e) => {
            if (scale > 1) {
                isDragging = true;
                const touch = e.touches[0];
                startX = touch.clientX - translateX;
                startY = touch.clientY - translateY;
            }
        }, { passive: false });

        container.addEventListener('touchmove', (e) => {
            if (isDragging) {
                e.preventDefault(); 
                const touch = e.touches[0];
                translateX = touch.clientX - startX;
                translateY = touch.clientY - startY;
                updateTransform();
            }
        }, { passive: false });

        container.addEventListener('touchend', () => {
            isDragging = false;
        });
    </script>
