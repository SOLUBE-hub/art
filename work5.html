<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=no">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+JP:wght@300;400;600&display=swap');
        body { margin: 0; padding: 0; font-family: 'Noto Serif JP', serif; background-color: #000; color: #e0e0e0; overflow: hidden; }
        .viewer-header { position: fixed; top: 0; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; box-sizing: border-box; z-index: 100; pointer-events: none; }
        .viewer-header > * { pointer-events: auto; }
        .artwork-title-nav { font-family: 'Cinzel', serif; font-size: 14px; letter-spacing: 4px; color: #880000; }
        
        .controls { display: flex; gap: 15px; }
        .control-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(136, 0, 0, 0.5); color: #880000; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.3s; }
        .control-btn:hover { background: #880000; color: #fff; }

        .viewer-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; cursor: grab; }
        .viewer-container:active { cursor: grabbing; }
        /* チラつき防止 */
        .artwork-wrapper { position: relative; transform-origin: center center; transition: transform 0.1s ease-out; will-change: transform; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
        
        .artwork-img { max-width: 90vw; max-height: 90vh; display: block; box-shadow: 0 0 50px rgba(136, 0, 0, 0.2); filter: grayscale(100%) contrast(150%); }
        
        /* opacityを利用した確実な非表示・表示の切り替え */
        .hidden-cipher {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-family: monospace; font-size: 18px; color: rgba(136, 0, 0, 0.8); pointer-events: none;
            text-align: center; letter-spacing: 5px; opacity: 0; transition: opacity 0.5s; width: 100%; z-index: 10;
        }
        .artwork-wrapper.zoomed-in .hidden-cipher { opacity: 1; text-shadow: 0 0 5px rgba(255,0,0,0.5); }

        .final-answer-box {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); border: 1px solid #333; padding: 20px 40px; text-align: center; z-index: 200; box-sizing: border-box;
        }
        .final-question { font-size: 12px; letter-spacing: 3px; color: #888; margin-bottom: 15px; }
        input[type="text"] { background: transparent; border: none; border-bottom: 1px solid #666; color: #fff; font-size: 16px; text-align: center; letter-spacing: 3px; outline: none; width: 150px; }
        button { background: #222; color: #888; border: 1px solid #444; padding: 5px 20px; margin-left: 10px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #880000; color: #fff; border-color: #880000; }

        /* スマホ向けレイアウト調整 */
        @media (max-width: 768px) {
            .viewer-header { padding: 15px; flex-direction: column; gap: 10px; }
            /* フッターとの被りを防ぐため bottom を強化 */
            .final-answer-box { width: 95%; padding: 15px 10px; bottom: 60px; z-index: 999; }
            input[type="text"] { width: 120px; }
            button { margin-left: 5px; padding: 5px 15px; }
        }
    </style>
<link rel="stylesheet" href="assets/css/default.css">

<body>
    <div class="viewer-header">
        <div class="artwork-title-nav">No.05 - 未完成の肖像</div>
        <div class="controls">
            <button class="control-btn" id="zoomOut">-</button>
            <button class="control-btn" id="zoomIn">+</button>
        </div>
    </div>

    <div class="viewer-container" id="viewerContainer">
        <div class="artwork-wrapper" id="artworkWrapper" style="transform: translate(0px, 0px) scale(1);">
            <img src="https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80" class="artwork-img" alt="未完成の肖像" draggable="false">
            <div class="hidden-cipher">
                [ A = 1, Z = 26 ]<br><br>
                13 - 1 - 20 - 5 - 18 - 9 - 1 - 12
            </div>
        </div>
    </div>

    <div class="final-answer-box">
        <div class="final-question">この絵に足りないものは何ですか？（英字）</div>
        <input type="text" id="finalInput" autocomplete="off" spellcheck="false">
        <button onclick="checkFinal()">SUBMIT</button>
    </div>

    <script>
        const container = document.getElementById('viewerContainer');
        const wrapper = document.getElementById('artworkWrapper');
        const btnZoomIn = document.getElementById('zoomIn');
        const btnZoomOut = document.getElementById('zoomOut');
        
        let scale = 1, translateX = 0, translateY = 0;
        let isDragging = false, startX, startY; 
        const REVEAL_SCALE = 2.5; 
        
        function updateTransform() {
            if (scale < 1) scale = 1; if (scale > 5) scale = 5;
            if (scale === 1) { translateX = 0; translateY = 0; }
            wrapper.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
            if (scale >= REVEAL_SCALE) wrapper.classList.add('zoomed-in');
            else wrapper.classList.remove('zoomed-in');
        }

        container.addEventListener('wheel', (e) => {
            e.preventDefault(); scale += e.deltaY * -0.005; updateTransform();
        }, { passive: false });

        btnZoomIn.addEventListener('click', () => { scale += 0.5; updateTransform(); });
        btnZoomOut.addEventListener('click', () => { scale -= 0.5; updateTransform(); });

        // PCマウス操作
        container.addEventListener('mousedown', (e) => {
            e.preventDefault();
            if (scale > 1) { isDragging = true; startX = e.clientX - translateX; startY = e.clientY - translateY; }
        });
        window.addEventListener('mousemove', (e) => {
            if (isDragging) { translateX = e.clientX - startX; translateY = e.clientY - startY; updateTransform(); }
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        // スマホタッチ操作
        container.addEventListener('touchstart', (e) => {
            if (scale > 1) {
                isDragging = true;
                const touch = e.touches[0];
                startX = touch.clientX - translateX; startY = touch.clientY - translateY;
            }
        }, { passive: false });
        
        container.addEventListener('touchmove', (e) => {
            if (isDragging) {
                e.preventDefault();
                const touch = e.touches[0];
                translateX = touch.clientX - startX; translateY = touch.clientY - startY;
                updateTransform();
            }
        }, { passive: false });
        
        container.addEventListener('touchend', () => { isDragging = false; });

        function checkFinal() {
            const answer = document.getElementById('finalInput').value.toUpperCase();
            if (answer === 'MATERIAL') {
                window.location.href = 'ending.html';
            } else {
                document.getElementById('finalInput').value = '';
                document.getElementById('finalInput').placeholder = 'INCORRECT';
            }
        }
    </script>
